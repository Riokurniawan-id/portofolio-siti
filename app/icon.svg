<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- "SN" Typography Monogram -->
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">SN</text>
  
  <!-- Tiny decorative star/dot in corner -->
  <circle cx="50" cy="14" r="3" fill="#a7f3d0" />
</svg>
