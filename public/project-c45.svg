<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPaddy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="24" fill="url(#bgPaddy)"/>

  <!-- Browser/App Header Bar -->
  <rect x="24" y="24" width="752" height="42" rx="12" fill="#334155"/>
  <circle cx="50" cy="45" r="6" fill="#ef4444"/>
  <circle cx="70" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="45" r="6" fill="#10b981"/>
  <rect x="120" y="34" width="380" height="22" rx="6" fill="#1e293b"/>
  <text x="140" y="49" fill="#94a3b8" font-family="sans-serif" font-size="11">https://sistem-prediksi-tanam.pertanian.go.id</text>

  <!-- Top App Title inside screen -->
  <rect x="24" y="80" width="752" height="60" fill="#0f172a"/>
  <text x="48" y="116" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Sistem Prediksi Waktu Tanam Padi — C4.5</text>
  <rect x="620" y="98" width="130" height="26" rx="13" fill="#065f46"/>
  <text x="640" y="115" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">✓ HKI Terdaftar</text>

  <!-- Left Column: Metrics / Input Form Cards -->
  <rect x="48" y="160" width="220" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="68" y="190" fill="#94a3b8" font-family="sans-serif" font-size="12">Parameter Cuaca</text>
  <text x="68" y="222" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">Curah Hujan</text>
  <text x="195" y="222" fill="#94a3b8" font-family="sans-serif" font-size="12">Sedang</text>

  <rect x="48" y="265" width="220" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="68" y="295" fill="#94a3b8" font-family="sans-serif" font-size="12">Suhu Rata-rata</text>
  <text x="68" y="327" fill="#f59e0b" font-family="sans-serif" font-size="20" font-weight="bold">28.4 °C</text>
  <text x="160" y="327" fill="#10b981" font-family="sans-serif" font-size="12">Optimal</text>

  <rect x="48" y="370" width="220" height="85" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="68" y="400" fill="#94a3b8" font-family="sans-serif" font-size="12">Keamanan Berkas</text>
  <text x="68" y="430" fill="#14b8a6" font-family="sans-serif" font-size="16" font-weight="bold">🔒 Enkripsi AES-256</text>

  <!-- Right Big Main Dashboard: C4.5 Decision & Recommendation -->
  <rect x="290" y="160" width="486" height="295" rx="18" fill="#1e293b" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Decision Header -->
  <rect x="314" y="184" width="170" height="26" rx="6" fill="#134e4a"/>
  <text x="326" y="201" fill="#2dd4bf" font-family="sans-serif" font-size="11" font-weight="bold">KLASIFIKASI POHON C4.5</text>

  <text x="314" y="248" fill="#94a3b8" font-family="sans-serif" font-size="13">Rekomendasi Waktu Tanam Optimal:</text>
  <text x="314" y="290" fill="#34d399" font-family="sans-serif" font-size="28" font-weight="bold">Oktober – November</text>
  <text x="314" y="318" fill="#cbd5e1" font-family="sans-serif" font-size="14">Musim Tanam I (Rendengan) — Wilayah Rulung Sari</text>

  <!-- Visual flowchart nodes inside card -->
  <line x1="320" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="1"/>

  <rect x="314" y="380" width="125" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="330" y="402" fill="#94a3b8" font-family="sans-serif" font-size="10">Data Cuaca</text>
  <text x="330" y="418" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Stasiun BPP</text>

  <text x="450" y="408" fill="#0d9488" font-family="sans-serif" font-size="16">→</text>

  <rect x="475" y="380" width="125" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="490" y="402" fill="#94a3b8" font-family="sans-serif" font-size="10">Pohon Keputusan</text>
  <text x="490" y="418" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Gain Ratio C4.5</text>

  <text x="610" y="408" fill="#0d9488" font-family="sans-serif" font-size="16">→</text>

  <rect x="635" y="380" width="125" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="650" y="402" fill="#a7f3d0" font-family="sans-serif" font-size="10">Prediksi Hasil</text>
  <text x="650" y="418" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Waktu Tanam</text>
</svg>
