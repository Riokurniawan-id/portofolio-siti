<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background circle with smooth gradient -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="340" cy="70" r="50" fill="#ccfbf1" opacity="0.6"/>
  <circle cx="60" cy="320" r="70" fill="#e0f2fe" opacity="0.6"/>

  <!-- Character Group with shadow -->
  <g filter="url(#softShadow)">
    <!-- Clothes / Blazer -->
    <path d="M120 400 L120 320 Q120 280 160 270 L200 300 L240 270 Q280 280 280 320 L280 400 Z" fill="url(#suitGrad)"/>
    <!-- Blouse collar under blazer -->
    <polygon points="175,270 200,310 225,270" fill="#ffffff"/>
    
    <!-- Hijab drape / shoulders -->
    <path d="M135 250 Q200 295 265 250 Q290 280 260 330 Q200 345 140 330 Q110 280 135 250 Z" fill="url(#hijabGrad)"/>

    <!-- Hijab head outline -->
    <ellipse cx="200" cy="180" rx="72" ry="88" fill="url(#hijabGrad)"/>

    <!-- Inner hijab framing -->
    <path d="M152 175 Q200 135 248 175 Q246 225 200 240 Q154 225 152 175 Z" fill="url(#innerGrad)"/>

    <!-- Face (soft warm skin tone) -->
    <path d="M158 180 Q200 148 242 180 Q240 222 200 236 Q160 222 158 180 Z" fill="#fde2d1"/>

    <!-- Eyes (smiling, warm) -->
    <path d="M178 188 Q187 183 194 188" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M206 188 Q213 183 222 188" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Eyebrows -->
    <path d="M175 180 Q185 175 195 181" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M205 181 Q215 175 225 180" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Soft blush -->
    <circle cx="174" cy="198" r="7" fill="#fca5a5" opacity="0.45"/>
    <circle cx="226" cy="198" r="7" fill="#fca5a5" opacity="0.45"/>

    <!-- Gentle Smile -->
    <path d="M188 208 Q200 218 212 208" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
